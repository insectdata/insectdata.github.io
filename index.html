<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>insectdata</title>
<style>
  :root { --bg: #fbfaf7; --fg: #24221f; --sub: #6b665e; --line: #e2ddd3; --link: #2f6b4f; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1c1b19; --fg: #ece8e1; --sub: #a59f95; --line: #3a3732; --link: #8cc7a6; }
  }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", sans-serif; line-height: 1.8; }
  main { max-width: 40rem; margin: 0 auto; padding: 3rem 16px; }
  h1 { font-size: 1.6rem; margin: 0 0 .5rem; letter-spacing: .02em; }
  p { margin: .6rem 0; }
  .sub { color: var(--sub); font-size: .92rem; }
  hr { border: 0; border-top: 1px solid var(--line); margin: 2rem 0; }
  a { color: var(--link); }
</style>
</head>
<body>
<main>
  <h1>insectdata</h1>
  <p>昆虫調査に役立つ情報を、公開されているデータをもとにまとめるサイトです。</p>
  <p class="sub">いま準備中です。水国リスト（河川水辺の国勢調査の生物リスト）を探せるページなどを、順に載せていきます。</p>
  <hr>
  <p><a href="https://insectdata.github.io/datainput/">調査の入力画面（スマホ用）</a></p>
</main>
</body>
</html>
